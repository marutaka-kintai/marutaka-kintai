<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b52"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>かんたん勤怠</title>
<style>body{margin:0;background:#f3f7f5;color:#19352d;font-family:system-ui,sans-serif}main{max-width:480px;margin:auto;padding:24px 18px}header{background:#176b52;color:white;padding:22px;border-radius:18px}h1{font-size:24px;margin:0 0 6px}small{opacity:.85}.card{background:white;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 2px 12px #0001}button{border:0;border-radius:14px;padding:20px;font-size:22px;font-weight:700;width:100%;background:#167d59;color:white}button.end{background:#be4a35}button:disabled{opacity:.5}.sub{font-size:14px;color:#52675d}.pending{font-weight:bold;color:#a45e08}input{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}li{padding:8px 0;border-bottom:1px solid #eee}#status{font-weight:bold;white-space:pre-wrap}#debug{font-size:12px;overflow-wrap:anywhere;color:#52675d}</style></head>
<body><main><header><h1>かんたん勤怠</h1><small>電波がなくても記録できます</small></header>
<section class="card" id="config"><label>初回設定：管理者から受け取った専用キー<input id="key" placeholder="個人専用キー"></label><p class="sub">専用キーはこの端末に保存されます。他人と共有しないでください。</p><button id="saveKey">設定を保存</button></section>
<section class="card" id="app" hidden><div class="sub" id="net"></div><h2 id="mode">勤務していません</h2><p id="clock"></p><button id="punch">仕事を開始</button><p id="status" role="status" aria-live="polite"></p><p class="pending" id="count"></p><button id="sync" style="background:#425e70;font-size:16px;padding:13px">今すぐ同期</button><p id="debug"></p></section>
<section class="card" id="history" hidden><b>この端末の最近の打刻</b><ul id="events"></ul></section><p class="sub">オフライン記録はこの端末内に保存。通信回復時またはアプリ再起動時に同期します。端末のデータ削除・機種変更前には未送信0件を確認してください。</p></main>
<iframe name="uploadTarget" id="uploadTarget" hidden title="勤怠送信"></iframe><script src="app.js?v=20261015-2" defer></script></body></html>
